name: Django CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medconsult_test
          POSTGRES_USER: medconsult_user
          POSTGRES_PASSWORD: medconsult_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: medconsult_test
        DB_USER: medconsult_user
        DB_PASSWORD: medconsult_pass
        REDIS_URL: redis://localhost:6379/1
        SECRET_KEY: test-secret-key-for-ci
      run: |
        python manage.py migrate --settings=config.settings.dev

    - name: Run tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: medconsult_test
        DB_USER: medconsult_user
        DB_PASSWORD: medconsult_pass
        REDIS_URL: redis://localhost:6379/1
        SECRET_KEY: test-secret-key-for-ci
      run: |
        python manage.py test --settings=config.settings.dev

    - name: Check for missing migrations
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: medconsult_test
        DB_USER: medconsult_user
        DB_PASSWORD: medconsult_pass
        REDIS_URL: redis://localhost:6379/1
        SECRET_KEY: test-secret-key-for-ci
      run: |
        python manage.py makemigrations --check --dry-run --settings=config.settings.dev
