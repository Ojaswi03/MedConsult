{% extends "layouts/app.html" %}

{% block title %}Contact Us - MedConsult{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Contact Us</h1>

    <div class="bg-white rounded-lg shadow-md p-8">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">
                    Subject
                </label>
                <input
                    type="text"
                    name="subject"
                    id="subject"
                    required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="How can we help?"
                >
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-2">
                    Message
                </label>
                <textarea
                    name="message"
                    id="message"
                    rows="6"
                    required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="Tell us more about your question or issue..."
                ></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 font-semibold">
                Send Message
            </button>
        </form>

        <div class="mt-8 pt-8 border-t">
            <h3 class="font-semibold mb-4">Other ways to reach us:</h3>
            <div class="space-y-2 text-sm text-gray-700">
                <p><strong>Email:</strong> support@medconsult.com</p>
                <p><strong>Phone:</strong> 1-800-MED-CONS</p>
                <p><strong>Hours:</strong> Monday - Friday, 9 AM - 5 PM EST</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
