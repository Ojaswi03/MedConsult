{% extends "layouts/app.html" %}

{% block title %}FAQ - MedConsult{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Frequently Asked Questions</h1>

    <div class="space-y-4">
        {% for faq in faqs %}
        <div class="bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-2">{{ faq.question }}</h3>
            <p class="text-gray-700">{{ faq.answer }}</p>
        </div>
        {% endfor %}
    </div>

    <div class="mt-8 bg-blue-50 border border-blue-200 rounded-lg p-6">
        <p class="text-gray-700">
            Can't find what you're looking for?
            <a href="{% url 'support:contact' %}" class="text-blue-600 hover:underline font-semibold">Contact our support team</a>.
        </p>
    </div>
</div>
{% endblock %}
