{% extends "layouts/admin.html" %}

{% block page_title %}Knowledge Graph{% endblock %}

{% block content %}
<div class="flex flex-col" style="height: calc(100vh - 112px);">

  {# Header #}
  <div class="flex items-center justify-between px-6 py-3 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 flex-shrink-0">
    <div>
      <h1 class="text-lg font-bold text-gray-900 dark:text-white">Knowledge Graph</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400" id="meta-line">Loading...</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="change-badge" class="hidden items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <span id="change-text"></span>
      </span>
      <button id="refresh-btn" onclick="manualRefresh()"
              class="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 rounded-lg transition">
        <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Refresh
      </button>
      <button onclick="exportJSON()" class="px-3 py-1.5 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">Export JSON</button>
      <button onclick="resetLayout()" class="px-3 py-1.5 text-sm bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-lg transition">Reset Layout</button>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">

    {# Left filter panel #}
    <div class="w-56 flex-shrink-0 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 overflow-y-auto p-4">
      <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-3">Filter by Type</p>
      <div id="filter-list" class="space-y-1"></div>

      <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mt-5 mb-2">Search</p>
      <input id="search-input" type="text" placeholder="Label or ID..."
             class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
             oninput="handleSearch(this.value)">

      <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mt-5 mb-2">Summary</p>
      <div id="summary-panel" class="space-y-1 text-xs text-gray-600 dark:text-gray-400"></div>
    </div>

    {# Graph canvas #}
    <div id="cy" class="flex-1 bg-gray-50 dark:bg-gray-950"></div>

    {# Right detail panel #}
    <div id="detail-panel" class="w-64 flex-shrink-0 bg-white dark:bg-gray-900 border-l border-gray-200 dark:border-gray-700 overflow-y-auto p-4 hidden">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm font-semibold text-gray-900 dark:text-white">Node Detail</p>
        <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="detail-content" class="space-y-2 text-sm"></div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>

<script>
const API_URL = '/api/v1/knowledge-graph/';

const TYPE_COLORS = {
  project:       { bg: '#7c3aed', border: '#5b21b6' },
  user:          { bg: '#16a34a', border: '#15803d' },
  appointment:   { bg: '#ea580c', border: '#c2410c' },
  slot:          { bg: '#ca8a04', border: '#a16207' },
  payment:       { bg: '#059669', border: '#047857' },
  conversation:  { bg: '#4f46e5', border: '#4338ca' },
  system_health: { bg: '#dc2626', border: '#b91c1c' },
};

const ROLE_COLORS = {
  patient:        { bg: '#16a34a', border: '#15803d' },
  doctor:         { bg: '#0891b2', border: '#0e7490' },
  platform_owner: { bg: '#9333ea', border: '#7e22ce' },
  platform_admin: { bg: '#7c3aed', border: '#5b21b6' },
  org_user:       { bg: '#d97706', border: '#b45309' },
};

function nodeColor(node) {
  const t = node.data('type');
  if (t === 'user') return ROLE_COLORS[node.data('role') || ''] || TYPE_COLORS.user;
  return TYPE_COLORS[t] || { bg: '#6b7280', border: '#4b5563' };
}

function esc(v) {
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let cy = null;
let graphData = null;
let activeFilters = new Set();

function cyStyle() {
  return [
    { selector: 'node', style: {
        'background-color': ele => nodeColor(ele).bg,
        'border-color': ele => nodeColor(ele).border,
        'border-width': 2,
        'label': 'data(label)',
        'color': '#fff',
        'text-valign': 'center', 'text-halign': 'center',
        'font-size': '9px', 'font-weight': 600,
        'text-wrap': 'ellipsis', 'text-max-width': '70px',
        'width': ele => sizeForType(ele.data('type')),
        'height': ele => sizeForType(ele.data('type')),
        'text-outline-width': 1,
        'text-outline-color': ele => nodeColor(ele).border,
    }},
    { selector: 'node:selected', style: { 'border-width': 4, 'border-color': '#f59e0b' }},
    { selector: 'node.faded',    style: { opacity: 0.15 }},
    { selector: 'node.new-node', style: { 'border-width': 3, 'border-color': '#34d399' }},
    { selector: 'edge', style: {
        'width': 1.5, 'line-color': '#94a3b8',
        'target-arrow-color': '#94a3b8', 'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'label': 'data(label)', 'font-size': '7px', 'color': '#94a3b8',
        'text-rotation': 'autorotate', 'text-margin-y': -6,
    }},
    { selector: 'edge.faded', style: { opacity: 0.05 }},
  ];
}

function sizeForType(type) {
  return { project: 60, system_health: 45 }[type] || 34;
}

function buildElements(data) {
  const nodeIds = new Set((data.nodes || []).map(n => n.id));
  const els = [];
  (data.nodes || []).forEach(n => {
    els.push({ group: 'nodes', data: { id: n.id, label: n.label || n.type, type: n.type, ...n.data }});
  });
  (data.edges || []).forEach(e => {
    if (nodeIds.has(e.source) && nodeIds.has(e.target))
      els.push({ group: 'edges', data: { id: e.id, source: e.source, target: e.target, label: e.label || '' }});
  });
  return els;
}

function initCy(elements) {
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: cyStyle(),
    layout: { name: 'cose', animate: true, animationDuration: 600, nodeRepulsion: 8000, idealEdgeLength: 100, edgeElasticity: 0.45, gravity: 0.25, fit: true, padding: 40 },
    wheelSensitivity: 0.3,
  });
  cy.on('tap', 'node', evt => showDetail(evt.target));
  cy.on('tap', evt => { if (evt.target === cy) closeDetail(); });
}

async function loadGraph() {
  try {
    const data = await fetchData();
    graphData = data;
    initCy(buildElements(data));
    updateMeta(data); updateSummary(data); buildFilters(data); applyFilters();
  } catch (e) {
    document.getElementById('meta-line').textContent = 'Error: ' + e.message;
  }
}

async function manualRefresh() {
  const btn  = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  btn.disabled = true;
  icon.style.animation = 'spin 0.8s linear infinite';

  try {
    const newData = await fetchData();

    if (!cy || !graphData) {
      graphData = newData;
      initCy(buildElements(newData));
      updateMeta(newData); updateSummary(newData); buildFilters(newData); applyFilters();
      return;
    }

    // Save positions
    const positions = {};
    cy.nodes().forEach(n => { positions[n.id()] = { ...n.position() }; });

    const oldNodeIds  = new Set((graphData.nodes || []).map(n => n.id));
    const newNodeIds  = new Set((newData.nodes  || []).map(n => n.id));
    const oldEdgeIds  = new Set((graphData.edges || []).map(e => e.id));
    const newEdgeIds  = new Set((newData.edges  || []).map(e => e.id));

    const addedNodes   = [...newNodeIds].filter(id => !oldNodeIds.has(id));
    const removedNodes = [...oldNodeIds].filter(id => !newNodeIds.has(id));
    const addedEdges   = [...newEdgeIds].filter(id => !oldEdgeIds.has(id));
    const removedEdges = [...oldEdgeIds].filter(id => !newEdgeIds.has(id));

    removedNodes.forEach(id => { const n = cy.getElementById(id); if (n.length) n.remove(); });
    removedEdges.forEach(id => { const e = cy.getElementById(id); if (e.length) e.remove(); });

    const ext = cy.extent();
    const cx  = (ext.x1 + ext.x2) / 2;
    const cmid = (ext.y1 + ext.y2) / 2;

    const newNodeMap = {};
    (newData.nodes || []).forEach(n => { newNodeMap[n.id] = n; });
    addedNodes.forEach(id => {
      const n = newNodeMap[id];
      cy.add({ group: 'nodes',
        data: { id: n.id, label: n.label || n.type, type: n.type, ...n.data },
        position: { x: cx + (Math.random() - 0.5) * 120, y: cmid + (Math.random() - 0.5) * 120 },
        classes: 'new-node',
      });
    });

    const newEdgeMap = {};
    (newData.edges || []).forEach(e => { newEdgeMap[e.id] = e; });
    addedEdges.forEach(id => {
      const e = newEdgeMap[id];
      if (e && cy.getElementById(e.source).length && cy.getElementById(e.target).length)
        cy.add({ group: 'edges', data: { id: e.id, source: e.source, target: e.target, label: e.label || '' }});
    });

    // Restore positions
    cy.nodes().forEach(n => { if (positions[n.id()]) n.position(positions[n.id()]); });

    if (addedNodes.length > 0) {
      cy.nodes('.new-node').layout({ name: 'cose', animate: true, animationDuration: 400, fit: false }).run();
      setTimeout(() => cy.nodes('.new-node').removeClass('new-node'), 2000);
    }

    graphData = newData;
    updateMeta(newData); updateSummary(newData); rebuildFilters(newData); applyFilters();
    showChangeBadge(addedNodes.length, removedNodes.length, addedEdges.length, removedEdges.length);

  } catch (e) {
    document.getElementById('meta-line').textContent = 'Refresh failed: ' + e.message;
  } finally {
    btn.disabled = false;
    icon.style.animation = '';
  }
}

function showChangeBadge(addN, remN, addE, remE) {
  const badge = document.getElementById('change-badge');
  const text  = document.getElementById('change-text');
  const noChange = addN === 0 && remN === 0 && addE === 0 && remE === 0;

  if (noChange) {
    text.textContent = 'No changes';
    badge.className = 'flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400';
  } else {
    const parts = [];
    if (addN) parts.push('+' + addN + ' node' + (addN > 1 ? 's' : ''));
    if (remN) parts.push('-' + remN + ' node' + (remN > 1 ? 's' : ''));
    if (addE) parts.push('+' + addE + ' edge' + (addE > 1 ? 's' : ''));
    if (remE) parts.push('-' + remE + ' edge' + (remE > 1 ? 's' : ''));
    text.textContent = parts.join(', ');
    badge.className = 'flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300';
  }

  clearTimeout(badge._timer);
  badge._timer = setTimeout(() => { badge.className = badge.className.replace('flex', 'hidden'); }, 6000);
}

async function fetchData() {
  const r = await fetch(API_URL, { headers: { 'X-CSRFToken': getCookie('csrftoken') }, credentials: 'same-origin' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ── Filters ───────────────────────────────────────────────────────────────────
function buildFilters(data) {
  activeFilters.clear();
  const counts = {};
  (data.nodes || []).forEach(n => { counts[n.type] = (counts[n.type] || 0) + 1; activeFilters.add(n.type); });
  const container = document.getElementById('filter-list');
  container.textContent = '';
  Object.entries(counts).sort((a,b) => b[1]-a[1]).forEach(([type, count]) => appendFilterRow(container, type, count));
}

function rebuildFilters(data) {
  const counts = {};
  (data.nodes || []).forEach(n => { counts[n.type] = (counts[n.type] || 0) + 1; });
  const container = document.getElementById('filter-list');
  const existingTypes = new Set([...container.querySelectorAll('.filter-cb')].map(cb => cb.dataset.type));
  const newTypes = new Set(Object.keys(counts));
  container.querySelectorAll('.filter-count').forEach(el => {
    if (counts[el.dataset.type] !== undefined) el.textContent = counts[el.dataset.type];
  });
  newTypes.forEach(t => { if (!existingTypes.has(t)) { activeFilters.add(t); appendFilterRow(container, t, counts[t]); }});
  existingTypes.forEach(t => {
    if (!newTypes.has(t)) {
      const row = container.querySelector('[data-type="' + t + '"]')?.closest('div');
      if (row) row.remove();
      activeFilters.delete(t);
    }
  });
}

function appendFilterRow(container, type, count) {
  const color = (TYPE_COLORS[type] || { bg: '#6b7280' }).bg;
  const row = document.createElement('div');
  row.className = 'flex items-center gap-2 cursor-pointer select-none py-0.5';

  const dot = document.createElement('span');
  dot.className = 'w-3 h-3 rounded-full flex-shrink-0';
  dot.style.background = color;

  const label = document.createElement('span');
  label.className = 'text-xs text-gray-700 dark:text-gray-300 flex-1';
  label.textContent = type;

  const countEl = document.createElement('span');
  countEl.className = 'text-xs font-mono text-gray-400 filter-count';
  countEl.dataset.type = type;
  countEl.textContent = count;

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'filter-cb';
  cb.dataset.type = type;
  cb.checked = activeFilters.has(type);
  cb.addEventListener('change', e => {
    if (e.target.checked) activeFilters.add(type); else activeFilters.delete(type);
    applyFilters();
  });

  row.appendChild(dot); row.appendChild(label); row.appendChild(countEl); row.appendChild(cb);
  container.appendChild(row);
}

function applyFilters() {
  if (!cy) return;
  cy.nodes().forEach(n => n.style('display', activeFilters.has(n.data('type')) ? 'element' : 'none'));
  cy.edges().forEach(e => {
    e.style('display', activeFilters.has(e.source().data('type')) && activeFilters.has(e.target().data('type')) ? 'element' : 'none');
  });
}

// ── Search ────────────────────────────────────────────────────────────────────
function handleSearch(query) {
  if (!cy) return;
  if (!query.trim()) { cy.nodes().removeClass('faded'); cy.edges().removeClass('faded'); return; }
  const q = query.toLowerCase();
  cy.nodes().forEach(n => {
    if (n.id().toLowerCase().includes(q) || n.data('label').toLowerCase().includes(q)) n.removeClass('faded');
    else n.addClass('faded');
  });
  cy.edges().addClass('faded');
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function showDetail(node) {
  const panel   = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  panel.classList.remove('hidden');
  content.textContent = '';

  const color = nodeColor(node).bg;
  const data  = node.data();

  const header = document.createElement('div');
  header.className = 'flex items-center gap-2 mb-3';
  const dot = document.createElement('span');
  dot.className = 'w-4 h-4 rounded-full';
  dot.style.background = color;
  const typeLbl = document.createElement('span');
  typeLbl.className = 'font-semibold text-gray-900 dark:text-white capitalize';
  typeLbl.textContent = data.type;
  header.appendChild(dot); header.appendChild(typeLbl);
  content.appendChild(header);

  const skip = new Set(['id', 'type', 'label']);
  Object.entries(data).forEach(([k, v]) => {
    if (skip.has(k) || v === null || v === undefined) return;
    let display = Array.isArray(v) ? (v.join(', ') || '-') : (typeof v === 'object' ? JSON.stringify(v) : String(v));

    const row = document.createElement('div');
    row.className = 'border-b border-gray-100 dark:border-gray-800 pb-1';
    const keyEl = document.createElement('p');
    keyEl.className = 'text-xs text-gray-400 uppercase tracking-wide';
    keyEl.textContent = k.replace(/_/g, ' ');
    const valEl = document.createElement('p');
    valEl.className = 'text-xs text-gray-800 dark:text-gray-200 break-all';
    valEl.textContent = display;
    row.appendChild(keyEl); row.appendChild(valEl);
    content.appendChild(row);
  });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.add('hidden');
  if (cy) cy.nodes().unselect();
}

// ── Meta + summary ────────────────────────────────────────────────────────────
function updateMeta(data) {
  const m = data.metadata || {};
  const el = document.getElementById('meta-line');
  el.textContent = 'Branch: ' + (m.git_head ? m.git_head.slice(0,7) : '-') +
    ' - Django ' + (m.django_version || '?') +
    ' - Generated: ' + (m.generated_at ? new Date(m.generated_at).toLocaleTimeString() : '?');
}

function updateSummary(data) {
  const panel = document.getElementById('summary-panel');
  panel.textContent = '';
  Object.entries(data.summary || {}).forEach(([k, v]) => {
    const row = document.createElement('div');
    row.className = 'flex justify-between';
    const kEl = document.createElement('span');
    kEl.className = 'text-gray-500 capitalize';
    kEl.textContent = k.replace(/_/g, ' ');
    const vEl = document.createElement('span');
    vEl.className = 'font-mono text-gray-800 dark:text-gray-200';
    vEl.textContent = v;
    row.appendChild(kEl); row.appendChild(vEl);
    panel.appendChild(row);
  });
}

// ── Reset layout ──────────────────────────────────────────────────────────────
function resetLayout() {
  if (!cy) return;
  cy.layout({ name: 'cose', animate: true, animationDuration: 600, nodeRepulsion: 8000, idealEdgeLength: 100, edgeElasticity: 0.45, gravity: 0.25, fit: true, padding: 40 }).run();
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportJSON() {
  if (!graphData) return;
  const blob = new Blob([JSON.stringify(graphData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'knowledge_graph.json'; a.click();
}

function getCookie(name) {
  const parts = ('; ' + document.cookie).split('; ' + name + '=');
  if (parts.length === 2) return parts.pop().split(';').shift();
  return '';
}

const s = document.createElement('style');
s.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(s);

loadGraph();
</script>
{% endblock %}
