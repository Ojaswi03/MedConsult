<div id="theme-toggle" class="space-y-3">
    <div class="flex gap-3">
        <!-- Light Theme -->
        <button
            type="button"
            hx-post="{% url 'update_theme' %}"
            hx-vals='{"theme": "light"}'
            hx-target="#theme-toggle"
            hx-swap="outerHTML"
            class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 rounded-lg transition-all
                   {% if current_theme == 'light' %}border-blue-500 bg-blue-50 dark:bg-blue-900/20{% else %}border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600{% endif %}"
            onclick="setTheme('light')"
        >
            <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
            </svg>
            <span class="font-medium text-gray-900 dark:text-white">Light</span>
        </button>

        <!-- Dark Theme -->
        <button
            type="button"
            hx-post="{% url 'update_theme' %}"
            hx-vals='{"theme": "dark"}'
            hx-target="#theme-toggle"
            hx-swap="outerHTML"
            class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 rounded-lg transition-all
                   {% if current_theme == 'dark' %}border-blue-500 bg-blue-50 dark:bg-blue-900/20{% else %}border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600{% endif %}"
            onclick="setTheme('dark')"
        >
            <svg class="w-5 h-5 text-indigo-500" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
            </svg>
            <span class="font-medium text-gray-900 dark:text-white">Dark</span>
        </button>

        <!-- System Theme -->
        <button
            type="button"
            hx-post="{% url 'update_theme' %}"
            hx-vals='{"theme": "auto"}'
            hx-target="#theme-toggle"
            hx-swap="outerHTML"
            class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 rounded-lg transition-all
                   {% if current_theme == 'auto' %}border-blue-500 bg-blue-50 dark:bg-blue-900/20{% else %}border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600{% endif %}"
            onclick="setTheme('auto')"
        >
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span class="font-medium text-gray-900 dark:text-white">System</span>
        </button>
    </div>
    <p class="text-sm text-gray-500 dark:text-gray-400">
        {% if current_theme == 'auto' %}
            Theme will match your system settings
        {% elif current_theme == 'dark' %}
            Dark theme is enabled
        {% else %}
            Light theme is enabled
        {% endif %}
    </p>
</div>
