{# Step Progress Indicator Component #}
<div class="mb-8">
    <div class="flex items-center justify-between">
        {% for step_num, step_title in steps %}
        <div class="flex items-center {% if not forloop.last %}flex-1{% endif %}">
            <div class="flex flex-col items-center">
                <div class="step-indicator w-10 h-10 rounded-full flex items-center justify-center font-semibold text-sm
                    {% if step_num < current_step %}bg-green-500 text-white
                    {% elif step_num == current_step %}bg-blue-600 text-white
                    {% else %}bg-gray-200 text-gray-500{% endif %}">
                    {% if step_num < current_step %}
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                        </svg>
                    {% else %}
                        {{ step_num }}
                    {% endif %}
                </div>
                <span class="text-xs mt-1 text-gray-500 hidden sm:block text-center max-w-16">{{ step_title }}</span>
            </div>
            {% if not forloop.last %}
            <div class="flex-1 h-1 mx-2 {% if step_num < current_step %}bg-green-500{% else %}bg-gray-200{% endif %}"></div>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>
