{# Camera & Microphone Test Component #}
<div id="camera-mic-test" class="border border-blue-100 dark:border-blue-900/40 rounded-xl p-5 bg-blue-50/50 dark:bg-blue-950/20 mb-4">
  <div class="flex items-center gap-2 mb-2">
    <svg class="w-5 h-5 text-blue-600 dark:text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
    </svg>
    <h3 class="font-semibold text-gray-900 dark:text-white text-sm">Camera &amp; Microphone Test</h3>
  </div>
  <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 ml-7">
    Verify your camera and microphone work before your first telehealth session.
  </p>

  <div class="space-y-4">
    <!-- Video Preview -->
    <div id="media-preview" class="bg-gray-900 rounded-xl overflow-hidden relative" style="height:220px;">
      <video id="video-preview" autoplay muted playsinline class="w-full h-full object-cover hidden"></video>
      <div id="media-placeholder" class="w-full h-full flex flex-col items-center justify-center text-white">
        <svg class="w-12 h-12 mb-2 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <span class="text-gray-400 text-sm">Click "Start Test" to begin</span>
      </div>
      <div id="test-overlay" class="absolute inset-0 bg-black/60 flex items-center justify-center hidden">
        <div class="text-center text-white">
          <svg class="animate-spin h-7 w-7 mx-auto mb-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-sm">Requesting access…</span>
        </div>
      </div>
    </div>

    <!-- Audio Level Meter -->
    <div id="audio-level-container" class="hidden">
      <label class="text-xs text-gray-500 dark:text-gray-400 block mb-1.5 font-medium">Microphone level</label>
      <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
        <div id="audio-meter" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-100" style="width:0%"></div>
      </div>
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Speak to test your microphone</p>
    </div>

    <!-- Control Buttons -->
    <div class="flex items-center gap-3">
      <button type="button" id="test-media-btn"
              class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        Start Test
      </button>
      <div id="test-status" class="text-sm text-gray-500 dark:text-gray-400"></div>
    </div>

    <!-- Test Result -->
    <div id="test-result" class="hidden">
      <div class="flex items-center gap-2 p-3 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800">
        <svg class="w-5 h-5 text-emerald-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span class="text-emerald-700 dark:text-emerald-300 text-sm font-medium">Camera and microphone are working correctly!</span>
      </div>
    </div>

    <!-- Browser Warning -->
    <div id="browser-warning" class="hidden">
      <div class="flex items-start gap-2 p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800">
        <svg class="w-5 h-5 text-amber-500 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <div>
          <span class="text-amber-800 dark:text-amber-200 font-medium text-sm">Browser Compatibility Issue</span>
          <p id="browser-warning-message" class="text-amber-700 dark:text-amber-300 text-xs mt-0.5"></p>
        </div>
      </div>
    </div>
  </div>
</div>
