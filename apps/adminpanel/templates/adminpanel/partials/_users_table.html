<div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-gray-50 dark:bg-gray-900/50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">User</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Role</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Joined</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
            {% for user in users %}
            {% include "adminpanel/partials/_user_row.html" %}
            {% empty %}
            <tr>
                <td colspan="5" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400">
                    No users found matching your criteria.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% if has_more %}
<div class="mt-4 flex justify-center">
    <button hx-get="{% url 'adminpanel:users_list' %}?page={{ current_page|add:1 }}"
            hx-target="#users-table-container"
            hx-swap="innerHTML"
            class="px-4 py-2 bg-white border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:bg-gray-900/50 transition-colors">
        Load More
    </button>
</div>
{% endif %}

<p class="mt-4 text-sm text-gray-500 dark:text-gray-400 text-center">
    Showing {{ users|length }} of {{ total }} users
</p>
