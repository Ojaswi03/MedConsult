{% if doc_url %}
<div class="text-center">
    {% if doc_url|lower|slice:"-4:" == ".pdf" %}
    <!-- PDF Viewer -->
    <iframe src="{{ doc_url }}" class="w-full h-96 border rounded-lg"></iframe>
    <p class="text-sm text-gray-500 mt-4">
        Can't see the document?
        <a href="{{ doc_url }}" target="_blank" class="text-blue-600 hover:underline">Open in new tab</a>
    </p>
    {% else %}
    <!-- Image Viewer -->
    <img src="{{ doc_url }}" alt="{{ doc_type }}" class="max-w-full max-h-96 mx-auto rounded-lg shadow-md">
    <div class="mt-4 flex justify-center space-x-3">
        <a href="{{ doc_url }}" target="_blank"
           class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            Open Full Size
        </a>
        <a href="{{ doc_url }}" download
           class="inline-flex items-center px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Download
        </a>
    </div>
    {% endif %}
</div>
{% else %}
<div class="text-center py-12">
    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
    </div>
    <p class="text-gray-500">No document uploaded for this type.</p>
</div>
{% endif %}
