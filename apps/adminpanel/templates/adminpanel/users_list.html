{% extends "layouts/admin.html" %}

{% block page_title %}Users{% endblock %}

{% block content %}
<div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
        <h2 class="text-2xl font-bold text-gray-900">User Management</h2>
        <p class="text-sm text-gray-500 mt-1">{{ total }} users total</p>
    </div>
    <a href="{% url 'adminpanel:users_export' %}?role={{ filters.role }}&is_active={{ filters.is_active }}"
       class="inline-flex items-center px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition-colors">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Export CSV
    </a>
</div>

<!-- Filters -->
<div class="bg-white rounded-lg shadow-sm p-4 mb-6">
    <form hx-get="{% url 'adminpanel:users_list' %}"
          hx-target="#users-table-container"
          hx-swap="innerHTML"
          hx-trigger="change, keyup delay:500ms from:input[name='search']"
          class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <!-- Search -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Search</label>
            <input type="text" name="search" value="{{ filters.search }}"
                   placeholder="Email, name, username..."
                   class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Role Filter -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <select name="role" class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="">All Roles</option>
                <option value="patient" {% if filters.role == 'patient' %}selected{% endif %}>Patients</option>
                <option value="doctor" {% if filters.role == 'doctor' %}selected{% endif %}>Doctors</option>
                <option value="admin" {% if filters.role == 'admin' %}selected{% endif %}>Admins</option>
            </select>
        </div>

        <!-- Status Filter -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
            <select name="is_active" class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="">All Status</option>
                <option value="true" {% if filters.is_active == 'true' %}selected{% endif %}>Active</option>
                <option value="false" {% if filters.is_active == 'false' %}selected{% endif %}>Inactive</option>
            </select>
        </div>

        <!-- Clear Button -->
        <div class="flex items-end">
            <a href="{% url 'adminpanel:users_list' %}"
               class="w-full px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors text-center">
                Clear Filters
            </a>
        </div>
    </form>
</div>

<!-- Users Table -->
<div id="users-table-container">
    {% include "adminpanel/partials/_users_table.html" %}
</div>

<!-- User Detail Modal -->
<div id="user-detail-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div id="user-detail-modal-content">
            <!-- Content loaded via HTMX -->
        </div>
    </div>
</div>
{% endblock %}

{% block admin_extra_js %}
<script>
function showUserModal(userId) {
    const modal = document.getElementById('user-detail-modal');
    modal.classList.remove('hidden');

    htmx.ajax('GET', '/internal/users/' + userId + '/', {
        target: '#user-detail-modal-content',
        swap: 'innerHTML'
    });
}

function closeUserModal() {
    document.getElementById('user-detail-modal').classList.add('hidden');
}

// Close modal on backdrop click
document.getElementById('user-detail-modal')?.addEventListener('click', function(e) {
    if (e.target === this) {
        closeUserModal();
    }
});

// Close modal on Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeUserModal();
    }
});
</script>
{% endblock %}
