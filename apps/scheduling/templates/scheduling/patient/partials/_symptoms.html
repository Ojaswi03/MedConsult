<!-- Symptoms grouped by category -->
<div class="space-y-4 max-h-72 overflow-y-auto pr-2">
    {% for category in categories %}
    <div>
        <h4 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">
            {{ category.name }}
        </h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            {% for symptom in category.symptoms.all %}
            {% if symptom.is_active %}
            <button type="button"
                    @click="toggleItem('{{ symptom.name|escapejs }}')"
                    :class="isSelected('{{ symptom.name|escapejs }}')
                        ? 'border-blue-500 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300'
                        : 'border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300'"
                    class="text-left px-3 py-2 text-sm border rounded-lg hover:border-blue-400 transition-colors flex items-center justify-between">
                <span>{{ symptom.name }}</span>
                <svg x-show="isSelected('{{ symptom.name|escapejs }}')"
                     class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                </svg>
            </button>
            {% endif %}
            {% endfor %}
        </div>
    </div>
    {% empty %}
    <p class="text-gray-500 dark:text-gray-400 text-sm">No symptoms available.</p>
    {% endfor %}
</div>
