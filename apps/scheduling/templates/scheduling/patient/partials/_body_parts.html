<!-- Body Parts grouped by category -->
<div class="space-y-4 max-h-64 overflow-y-auto pr-2">
    {% for category_name, body_parts in categories.items %}
    <div>
        <h4 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">
            {{ category_name }}
        </h4>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {% for bp in body_parts %}
            <button type="button"
                    @click="selectBodyPart({{ bp.id }}, '{{ bp.name|escapejs }}')"
                    class="text-left px-3 py-2 text-sm bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border dark:border-gray-600 rounded-lg hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors">
                {{ bp.name }}
            </button>
            {% endfor %}
        </div>
    </div>
    {% empty %}
    <p class="text-gray-500 dark:text-gray-400 text-sm">No body parts available.</p>
    {% endfor %}
</div>
