<div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
    <div class="p-6">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Edit Availability Window</h3>
            <button onclick="document.getElementById('edit-window-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <form hx-post="{% url 'doctor:update_window' window.id %}"
              hx-target="#availability-windows-list"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) { document.getElementById('edit-window-modal').classList.add('hidden'); }">
            {% csrf_token %}
            {% include 'scheduling/doctor/partials/_window_form.html' %}
        </form>
    </div>
</div>
