{% extends "layouts/app.html" %}

{% block title %}Create Referral - MedConsult{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <a href="{% url 'doctor:doctor_schedule' %}" class="inline-flex items-center text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 mb-4">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to Schedule
    </a>

    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Refer Patient</h1>
    <p class="text-gray-600 dark:text-gray-400 mb-8">
        Patient: <strong class="text-gray-900 dark:text-white">{{ appointment.patient.get_display_name }}</strong>
    </p>

    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="referred_to_doctor_id" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                    Refer to Doctor <span class="text-red-500">*</span>
                </label>
                <select name="referred_to_doctor_id" id="referred_to_doctor_id" required
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                    <option value="">Select a doctor...</option>
                    {% for doc in all_doctors %}
                    <option value="{{ doc.id }}">Dr. {{ doc.user.get_display_name }} &mdash; {{ doc.specialization }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="reason" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                    Referral Reason <span class="text-red-500">*</span>
                </label>
                <textarea name="reason" id="reason" rows="4" required
                          placeholder="Describe the clinical reason for the referral..."
                          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"></textarea>
            </div>

            <div>
                <label for="notes" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                    Additional Notes (optional)
                </label>
                <textarea name="notes" id="notes" rows="2"
                          placeholder="Any additional information for the receiving doctor..."
                          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"></textarea>
            </div>

            <div class="pt-4 border-t border-gray-200 dark:border-gray-700 flex gap-3">
                <button type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium transition-colors">
                    Send Referral
                </button>
                <a href="{% url 'doctor:doctor_schedule' %}"
                   class="px-6 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
