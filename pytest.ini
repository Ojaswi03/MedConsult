[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_xmllint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_lint -p no:ament_copyright --cov=apps --cov-report=term-missing --cov-fail-under=40
