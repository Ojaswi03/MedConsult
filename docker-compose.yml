version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: medconsult_postgres
    environment:
      POSTGRES_DB: medconsult
      POSTGRES_USER: medconsult_user
      POSTGRES_PASSWORD: medconsult_pass
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medconsult_user -d medconsult"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medconsult_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
