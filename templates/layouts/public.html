{% extends "base.html" %}

{% block body %}
<div class="min-h-screen flex flex-col">
    <!-- Simple public header -->
    <header class="bg-blue-50/90 dark:bg-gray-950/90 backdrop-blur-sm border-b border-blue-100/60 dark:border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <a href="{% url 'landing' %}" class="text-2xl font-bold text-blue-700 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 flex items-center gap-2">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                    MedConsult
                </a>
                <div class="flex items-center gap-3">
                    <a href="{% url 'organizations:org_register' %}" class="text-sm font-medium text-indigo-700 dark:text-indigo-300 hover:text-indigo-600 dark:hover:text-indigo-200 transition-colors hidden sm:inline">For Hospitals</a>
                    <a href="{% url 'login' %}" class="text-sm font-medium text-blue-800 dark:text-blue-300 hover:text-blue-600 dark:hover:text-blue-200 transition-colors">Login</a>
                    <a href="{% url 'signup' %}" class="text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors shadow-sm shadow-blue-200 dark:shadow-none">Sign Up</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Messages -->
    {% include 'partials/messages.html' %}

    <!-- Main content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'partials/footer.html' %}
</div>
{% endblock %}
