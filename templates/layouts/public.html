{% extends "base.html" %}

{% block body %}
<div class="min-h-screen flex flex-col">
    <!-- Simple public header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <a href="{% url 'landing' %}" class="text-2xl font-bold text-blue-600 hover:text-blue-700">MedConsult</a>
                <div class="space-x-4">
                    <a href="{% url 'login' %}" class="text-gray-700 hover:text-blue-600">Login</a>
                    <a href="{% url 'signup' %}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Sign Up</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Messages -->
    {% include 'partials/messages.html' %}

    <!-- Main content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'partials/footer.html' %}
</div>
{% endblock %}
