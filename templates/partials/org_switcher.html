{% if is_platform_staff %}
<div class="relative" x-data="{ open: false }">
  <button @click="open = !open" @click.away="open = false"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium
                 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300
                 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors border border-indigo-200 dark:border-indigo-700">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/>
    </svg>
    <span class="max-w-[120px] truncate">
      {% if user_organization %}{{ user_organization.name }}{% else %}Platform View{% endif %}
    </span>
    <svg class="w-3 h-3 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>

  <div x-show="open" x-cloak
       class="absolute left-0 mt-2 w-64 bg-white dark:bg-gray-800 rounded-xl shadow-lg z-50
              border border-gray-200 dark:border-gray-700 py-1">
    <p class="px-3 py-1.5 text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Switch Organization</p>

    <!-- Platform view (no org) -->
    <form method="post" action="{% url 'switch_org' %}">
      {% csrf_token %}
      <input type="hidden" name="org_id" value="">
      <input type="hidden" name="next" value="{{ request.path }}">
      <button type="submit"
              class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700
                     {% if not user_organization %}font-semibold text-indigo-600 dark:text-indigo-400{% else %}text-gray-700 dark:text-gray-300{% endif %}
                     flex items-center gap-2">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/>
        </svg>
        Platform View (all orgs)
        {% if not user_organization %}
        <svg class="w-3 h-3 ml-auto text-indigo-600 dark:text-indigo-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
        </svg>
        {% endif %}
      </button>
    </form>

    {% if active_organizations %}
    <div class="border-t border-gray-100 dark:border-gray-700 mt-1 pt-1">
      {% for org in active_organizations %}
      <form method="post" action="{% url 'switch_org' %}">
        {% csrf_token %}
        <input type="hidden" name="org_id" value="{{ org.id }}">
        <input type="hidden" name="next" value="{{ request.path }}">
        <button type="submit"
                class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700
                       {% if user_organization.id == org.id %}font-semibold text-indigo-600 dark:text-indigo-400{% else %}text-gray-700 dark:text-gray-300{% endif %}
                       flex items-center gap-2">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/>
          </svg>
          <span class="truncate">{{ org.name }}</span>
          <span class="ml-auto text-xs text-gray-400 dark:text-gray-500 shrink-0">{{ org.get_org_type_display }}</span>
          {% if user_organization.id == org.id %}
          <svg class="w-3 h-3 text-indigo-600 dark:text-indigo-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
          </svg>
          {% endif %}
        </button>
      </form>
      {% endfor %}
    </div>
    {% endif %}
  </div>
</div>
{% endif %}
