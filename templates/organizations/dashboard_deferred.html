{% extends "layouts/app.html" %}
{% block title %}{{ org.name }} Dashboard{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-16 text-center">
  <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
    </svg>
  </div>
  <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-2">{{ org.name }}</h1>
  <p class="text-gray-500 mb-2">You are a member of this organization as <strong>{{ membership_role }}</strong>.</p>
  <p class="text-sm text-gray-400">Your role-specific dashboard is coming soon.</p>
</div>
{% endblock %}
