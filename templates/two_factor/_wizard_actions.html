{% load i18n %}
<div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-200 dark:border-gray-700">
  <div class="flex gap-2">
    {% if wizard.steps.prev %}
      <button name="wizard_goto_step" type="submit" value="{{ wizard.steps.prev }}"
              class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
        {% trans "Back" %}
      </button>
    {% else %}
      <button disabled type="button"
              class="px-4 py-2 text-sm font-medium text-gray-400 dark:text-gray-600 bg-gray-100 dark:bg-gray-700 rounded-lg cursor-not-allowed">
        {% trans "Back" %}
      </button>
    {% endif %}
  </div>

  <div class="flex items-center gap-3">
    <a href="{% url 'skip_2fa' %}"
       class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors">
      {% trans "Skip for now" %}
    </a>
    <button type="submit"
            class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
      {% trans "Next" %}
    </button>
  </div>
</div>
